<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDP per Capita vs Calorie Intake Visualization</title>
    <link rel="stylesheet" href="style.css" />
    <script src="d3.v7.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>GDP per Capita vs Daily Calorie Intake</h1>

      <!-- Top Section: Map + Controls -->
      <div class="top-section">
        <!-- Large Map Area -->
        <div class="map-container">
          <div class="chart-placeholder map-placeholder">
            <h3>World Choropleth Map</h3>
            <p>Geographic visualization of nutritional data</p>
          </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
          <!-- Nutrient Type Filter -->
          <div class="control-group">
            <label for="nutrientSelect">Nutrient Type:</label>
            <select id="nutrientSelect">
              <option value="total-calories">Total Calories</option>
              <option value="protein-calories">Calories from Protein</option>
              <option value="carbs-calories">Calories from Carbohydrates</option>
              <option value="fat-calories">Calories from Fat</option>
            </select>
          </div>

          <!-- Year Slider -->
          <div class="control-group">
            <label for="yearSlider">Year: <span id="yearValue">2022</span></label>
            <input type="range" id="yearSlider" min="1961" max="2022" value="2022" step="1" class="year-slider">
            <div class="slider-labels">
              <span>1961</span>
              <span>2022</span>
            </div>
          </div>

          <!-- Scatter Plot Data Dimension -->
          <div class="control-group">
            <label for="dataSelect">Scatter Plot Data:</label>
            <select id="dataSelect">
              <option value="calories-gdp">GDP per Capita vs Daily Calories</option>
              <option value="obesity-gdp">GDP per Capita vs Obesity Rate</option>
              <option value="calories-obesity">Daily Calories vs Obesity Rate</option>
            </select>
          </div>

          <!-- Country Selection -->
          <div class="control-group country-selection">
            <label for="countrySelect">Countries:</label>
            <div class="country-multiselect">
              <input type="text" id="countrySearch" placeholder="Search countries..." />
              <div class="checkbox-container">
                <div class="checkbox-controls">
                  <button id="selectAllCountries" type="button">Select All</button>
                  <button id="clearAllCountries" type="button">Clear All</button>
                </div>
                <div id="countryCheckboxes" class="checkbox-list">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Section: Charts -->
      <div class="bottom-section">
        <!-- Scatter Plot (Implemented) -->
        <div class="chart-container scatter-plot-container">
          <h4>Scatter Plot Analysis</h4>
          <div id="scatterplot"></div>
        </div>

        <!-- Multi-Line Chart Placeholder -->
        <div class="chart-placeholder line-chart-placeholder">
          <h4>Multi-Line Chart</h4>
          <p>Obesity evolution over time</p>
        </div>

        <!-- Donut Chart -->
        <div class="chart-container donut-chart-container">
          <div id="donutchart"></div>
        </div>
      </div>
    </div>

    <script src="idioms/scatterplot.js"></script>
    <script src="idioms/donutchart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
