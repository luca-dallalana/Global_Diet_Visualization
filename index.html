<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Dietary Behaviour Visualization</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="./script.js"></script>
    <script src="./idioms/scatterplot.js"></script>
    <script src="./idioms/donutchart.js"></script>
    <script src="./idioms/rangeslider.js"></script>
  </head>
  <body onload="init()">
    <div class="container">
      <VisualizationTitle style="text-align: center; display: flex; justify-content: center; align-items: center; width: 100%; height: 60px; margin: 0 auto; font-size: 24px; font-weight: bold;">Global Dietary Behaviour Visualization</VisualizationTitle>

      <div class="Map">
        <h3>World Choropleth Map</h3>
        <img src="WorldMapPng.png" alt="World Map Choropleth" style="max-width: 80%; max-height: 80%; width: auto; height: auto; object-fit: contain; display: block; margin: 10px auto; padding: 10px;">
      </div>

      <div class="Controls">
        <div class="control-group">
          <label for="nutrientSelect">Nutrient Type:</label>
          <select id="nutrientSelect">
            <option value="total-calories">Total Calories</option>
            <option value="protein-calories">Calories from Protein</option>
            <option value="carbs-calories">Calories from Carbohydrates</option>
            <option value="fat-calories">Calories from Fat</option>
          </select>
        </div>

        <div class="control-group">
          <label>Year Range:</label>
          <div id="yearRangeSlider"></div>
        </div>

        <div class="control-group">
          <label for="dataSelect">Scatter Plot Data:</label>
          <select id="dataSelect">
            <option value="calories-gdp">GDP per Capita vs Daily Calories</option>
            <option value="obesity-gdp">GDP per Capita vs Obesity Rate</option>
            <option value="calories-obesity">Daily Calories vs Obesity Rate</option>
          </select>
        </div>

        <div class="control-group country-selection">
          <label for="countrySelect">Countries:</label>
          <div class="country-multiselect">
            <input type="text" id="countrySearch" placeholder="Search countries..." />
            <div class="checkbox-container">
              <div class="checkbox-controls">
                <button id="selectAllCountries" type="button">Select All</button>
                <button id="clearAllCountries" type="button">Clear All</button>
              </div>
              <div id="countryCheckboxes" class="checkbox-list"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="ScatterPlot">
        <h4>Scatter Plot Analysis</h4>
        <div id="scatterplot"></div>
      </div>

      <div class="LineChart">
        <h4>Multi-Line Chart</h4>
        <img src="LineChartPNG.png" alt="Line Chart" style="max-width: 80%; max-height: 80%; width: auto; height: auto; object-fit: contain; display: block; margin: -30px auto 10px auto; padding: 10px;">
      </div>

      <div class="DonutChart">
        <div id="donutchart"></div>
      </div>
    </div>
  </body>
</html>
